services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppass}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  web:
    build: .
    depends_on: [db]
    env_file: [.env]
    ports: ["8000:8000"]
    command: /app/entrypoint.sh
    volumes: [".:/app"]
volumes:
  pgdata:
