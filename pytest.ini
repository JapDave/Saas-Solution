[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
# Default options for unit tests (acceptance tests use pytest-acceptance.ini)
addopts = -q
markers =
    acceptance: Acceptance tests that run against actual API endpoints
    unit: Unit tests (default, can be used to exclude acceptance tests)
    integration: Integration tests
    slow: Tests that take a long time to run