[pytest]
# Configuration for running acceptance tests only
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
testpaths = acceptance_tests
addopts = 
    -v
    -m acceptance
    --tb=short
    --reuse-db
    --nomigrations
markers =
    acceptance: Acceptance tests that run against actual API endpoints
    no_server_check: Skip server availability check for this test
